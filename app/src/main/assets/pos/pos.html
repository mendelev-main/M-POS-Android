<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>M POS — касса</title>
<style>
  @font-face{
    font-family:'Manrope';
    src:url('Web/fonts/Manrope-Variable.ttf') format('truetype');
    font-style:normal;
    font-weight:200 800;
    font-display:swap;
  }
  :root{
    --bg:#F5F4F0;
    --surface:#FFFFFF;
    --ink:#1B1F2A;
    --muted:#767C8C;
    --accent:#0E8F6F;
    --accent-ink:#ffffff;
    --accent-soft:#E4F3EE;
    --navy:#22273A;
    --danger:#E0483E;
    --danger-soft:#FBE7E5;
    --success:#26733A;
    --success-ink:#FFFFFF;
    --success-soft:#E3F6E8;
    --success-border:#C9EBCF;
    --warning:#8A5A17;
    --warning-soft:#FFF4E9;
    --warning-border:#F5DCB8;
    --info:#31558F;
    --info-soft:#E8F0FF;
    --info-border:#C7D7F2;
    --control-off:#B9BEC8;
    --switch-width:48px;
    --switch-height:28px;
    --switch-thumb:22px;
    --control-height:44px;
    --control-height-large:48px;
    --control-radius:10px;
    --control-radius-large:12px;
    --border:#E7E4DD;
    --radius-l:22px;
    --radius-m:16px;
    --radius-s:10px;
    --shadow:0 1px 2px rgba(27,31,42,.04), 0 8px 24px rgba(27,31,42,.05);
  }
  :root[data-theme='dark']{
    --bg:#171A21; --surface:#222631; --ink:#F4F6FA; --muted:#A9B0BF;
    --accent:#31B98D; --accent-ink:#07140F; --accent-soft:#173B31;
    --navy:#10131A; --danger:#FF6B61; --danger-soft:#432522;
    --success:#8FE0BE; --success-ink:#07140F; --success-soft:#1D4638; --success-border:#43C38D;
    --warning:#E9C989; --warning-soft:#3A3022; --warning-border:#5A4A30;
    --info:#BFD5FF; --info-soft:#26334A; --info-border:#3C506F;
    --control-off:#5A6170;
    --border:#353B49; --shadow:0 1px 2px rgba(0,0,0,.18), 0 10px 28px rgba(0,0,0,.22);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select{font-family:inherit;}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;}
  #print-area{display:none;}

  /* ---- Top bar ---- */
  .topbar{
    display:flex;align-items:center;gap:10px;
    padding:12px 16px;background:var(--navy);color:#fff;flex-shrink:0;
  }
  .brand{display:flex;align-items:center;justify-content:center;padding:8px 14px;border-radius:100px;font-weight:700;font-size:14px;color:rgba(255,255,255,.62);transition:background .15s,color .15s;flex-shrink:0;}
  .brand.active{background:rgba(255,255,255,.14);color:#fff;}
  .brand:not(.active):hover{color:#fff;}
  .tabs{display:flex;gap:4px;flex:1;}
  .tab{
    padding:8px 14px;border-radius:100px;font-weight:600;font-size:14px;
    color:rgba(255,255,255,.62);transition:background .15s,color .15s;
  }
  .tab.active{background:rgba(255,255,255,.14);color:#fff;}
  .tab:not(.active):hover{color:#fff;}
  .shift-pill{
    display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:100px;
    background:rgba(255,255,255,.08);font-size:13.5px;font-weight:600;white-space:nowrap;cursor:pointer;
  }
  .settings-topbar-btn{
    width:44px;height:44px;min-width:44px;padding:0;border-radius:100px;
    display:flex;align-items:center;justify-content:center;
    color:rgba(255,255,255,.62);background:transparent;
    transition:background .15s,color .15s;flex-shrink:0;
  }
  .settings-topbar-btn:hover{color:#fff;}
  .settings-topbar-btn.active{background:rgba(255,255,255,.14);color:#fff;}
  .settings-topbar-btn svg{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .events-tab{margin-left:auto;position:relative;display:flex;align-items:center;gap:7px;}
  .events-tab svg{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .events-count{min-width:20px;height:20px;padding:0 6px;border-radius:100px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .dot.on{background:#3ED28E;box-shadow:0 0 0 3px rgba(62,210,142,.25);}
  .dot.off{background:#FF7A70;box-shadow:0 0 0 3px rgba(255,122,112,.25);}

  .main{flex:1;min-height:0;min-width:0;overflow:hidden;}
  .screen{display:none;height:100%;width:100%;min-width:0;max-width:100%;}
  .screen.active{display:flex;}
  .flash-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 32px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:100px;font-weight:600;font-size:14px;line-height:1.35;text-align:center;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none;}
  .clipboard-copy-buffer{position:fixed;opacity:0;pointer-events:none;}

  /* ---- POS screen ---- */
  #screen-pos{gap:16px;padding:16px;min-width:0;overflow:hidden;}
  .pos-left{flex:1;min-width:0;max-width:100%;display:flex;flex-direction:column;gap:12px;}
  .pos-toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;min-height:44px;}
  .search-box{
    flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);
    padding:12px 16px;font-size:15px;color:var(--ink);
  }
  .search-box:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .park-btn{
    background:var(--info-soft);border:1px solid var(--info-border);color:var(--info);border-radius:var(--radius-m);
    padding:11px 15px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap;
    box-shadow:0 1px 2px rgba(49,85,143,.08);
  }
  .demand-btn{
    border-color:rgba(52,199,89,.55);
    box-shadow:0 0 0 1px rgba(52,199,89,.12),0 0 10px rgba(52,199,89,.22);
  }
  .demand-btn.active{
    background:rgba(255,59,48,.10);
    border-color:#FF453A;
    color:#B42318;
    box-shadow:0 0 0 1px rgba(255,69,58,.30),0 0 12px rgba(255,59,48,.36);
  }
  :root[data-theme='dark'] .demand-btn{
    border-color:rgba(48,209,88,.50);
    box-shadow:0 0 0 1px rgba(48,209,88,.10),0 0 11px rgba(48,209,88,.20);
  }
  :root[data-theme='dark'] .demand-btn.active{
    background:rgba(255,69,58,.12);
    border-color:#FF453A;
    color:#FF9B95;
    box-shadow:0 0 0 1px rgba(255,69,58,.28),0 0 12px rgba(255,59,48,.34);
  }
  .zone-title-btn{
    background:#F0E9FF;border:1px solid #D7C8F5;color:#5E4691;border-radius:var(--radius-m);
    padding:11px 16px;font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:8px;
    width:auto;max-width:none;flex:0 0 auto;white-space:nowrap;overflow:visible;text-overflow:clip;
  }
  :root[data-theme='dark'] .zone-title-btn{background:#332B45;border-color:#51436C;color:#DCCBFF;}
  .park-badge{background:var(--accent);color:#fff;border-radius:100px;padding:1px 8px;font-size:12.5px;}
  .pos-actions-left{display:flex;align-items:center;gap:10px;justify-content:flex-end;flex-shrink:0;margin-left:auto;}
  .pos-toolbar-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1;}
  .category-color-picker{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px;}
  .category-color-option{width:44px;height:44px;border-radius:var(--radius-s);border:3px solid transparent;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.10);background:var(--category-color);}
  .category-color-option.selected{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink);}

  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
  .chip{
    padding:8px 15px;border-radius:100px;background:var(--surface);border:1px solid var(--border);
    font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;flex-shrink:0;
  }
  .chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .sections-wrap{flex:1;overflow-y:auto;padding-bottom:8px;display:flex;flex-direction:column;gap:22px;}
  .cat-section{display:flex;flex-direction:column;gap:10px;}
  .cat-header{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;color:var(--ink);}
  .cat-handle{cursor:grab;color:var(--muted);font-size:18px;touch-action:none;padding:2px 4px;}
  .product-grid{
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
    grid-template-rows:repeat(4,minmax(0,1fr));gap:12px;align-content:stretch;
    min-height:56px;overflow:auto;padding:4px;border-radius:18px;
  }
  .product-grid.layout-edit-grid{
    position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
    grid-template-rows:repeat(4,minmax(0,1fr));gap:12px;align-content:stretch;overflow:hidden;
    padding:14px;background-image:radial-gradient(circle, rgba(118,124,140,.20) 1px, transparent 1px);
    background-size:18px 18px;border:1px solid var(--border);
  }
  .layout-cell-highlight{position:absolute;pointer-events:none;border:2px dashed var(--accent);background:var(--accent-soft);border-radius:18px;z-index:0;transition:all .08s ease;}
  .category-edit-grid{position:relative;}.category-edit-grid .layout-tile{touch-action:none;}.navigation-action{position:relative;z-index:2;min-height:44px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius-s);background:var(--surface);color:var(--ink);font-size:12px;align-self:flex-end;}
  .layout-tile{position:relative;min-width:0;z-index:1;}
  .layout-tile[hidden]{display:none;}
  .layout-tile.drag-placeholder{visibility:hidden;}
  .layout-drag-clone{
    position:fixed;z-index:9999;pointer-events:none;width:var(--drag-w);height:var(--drag-h);
    transition:transform .06s ease;filter:drop-shadow(0 14px 24px rgba(27,31,42,.18));
  }
  .layout-drag-clone .pcard{height:100%;transform:none!important;cursor:grabbing!important;}
  .layout-edit-grid .pcard.edit-tile{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;}
  @media (min-width:900px){
    .product-grid{grid-template-columns:repeat(5,minmax(0,1fr));}
    .product-grid.layout-edit-grid{grid-template-columns:repeat(5,minmax(0,1fr));}
  }
  /* iPad portrait: give the POS tiles more breathing room instead of squeezing them. */
  @media (orientation:portrait) and (min-width:700px){
    #screen-pos .product-grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:12px;}
    #screen-pos .product-grid.layout-edit-grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:12px;}
  }
  .pcard{
    background:var(--surface);border-radius:var(--radius-m);padding:14px;text-align:left;
    box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-height:0;height:100%;box-sizing:border-box;
    border:1px solid transparent;transition:transform .08s;
  }
  .pcard:active{transform:scale(.97);}
  .pcard.disabled{opacity:.42;}
  .pcard.edit-tile{cursor:grab;border:1.5px dashed var(--border);touch-action:none;}
  .layout-dragging{opacity:.55;transform:scale(.98);}
  .layout-drop-before{outline:3px solid var(--accent);outline-offset:2px;}
  .sortable-ghost{opacity:.35;}
  .sortable-chosen{box-shadow:0 0 0 2px var(--accent);}
  .search-box:disabled,.park-btn:disabled{opacity:.45;}
  .tile-symbol{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:46px;line-height:1;font-weight:800;letter-spacing:1px;opacity:.6;pointer-events:none;z-index:0;white-space:nowrap;text-align:center;}
  .pcard > *:not(.tile-symbol){position:relative;z-index:1;}
  .pcard .tile-symbol + .pcard-name{position:relative;z-index:1;}
  .pcard-name{font-weight:700;font-size:14.5px;line-height:1.25;flex:1;}
  .pcard-bottom{display:flex;justify-content:space-between;align-items:flex-end;}
  .pcard-price{font-weight:800;font-size:15.5px;}
  .pcard-stock{font-size:11.5px;color:var(--muted);font-weight:600;}
  .pcard-stock.low{color:var(--danger);}
  .pcard-type{font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:100px;align-self:flex-start;}
  .layout-tile .tile-remove{position:absolute;top:7px;right:7px;width:28px;height:28px;border-radius:50%;background:var(--danger-soft);color:var(--danger);font-size:15px;font-weight:800;z-index:2;}
  .layout-tile .tile-remove::before{content:'';position:absolute;inset:-8px;border-radius:50%;}
  .category-tile>.pcard{background:var(--category-color,var(--accent-soft));}.category-tile .pcard-name:after{content:'›';float:right;color:var(--muted);font-size:20px;line-height:14px;}
  .folder-tile .pcard-name{font-size:19px;font-weight:800;line-height:1.2;display:flex;align-items:center;justify-content:center;text-align:center;width:100%;}
  .folder-tile .pcard-name:after{content:none;}
  :root[data-theme='dark'] .category-tile .pcard{background:var(--surface)!important;border:2px solid var(--category-color);box-shadow:0 0 8px color-mix(in srgb,var(--category-color) 70%, transparent),0 0 18px color-mix(in srgb,var(--category-color) 28%, transparent);}
  .layout-list{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;}
  .layout-add-row{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
  .layout-add-row:last-child{border-bottom:none;}
  .layout-add-row .name{flex:1;font-weight:700;font-size:14px;}
  .layout-add-row .sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .layout-add-btn{width:44px;height:44px;border-radius:var(--radius-s);background:var(--accent-soft);color:var(--accent);font-size:22px;font-weight:700;}.layout-editor-note{text-align:left;margin:0 0 12px;}.layout-editor-heading{font-weight:800;padding:4px 0;}.layout-editor-heading.products{padding-top:10px;}.pos-workspace-grid{overflow-y:auto;flex:1;align-content:start;}.pos-grid-empty{grid-column:1/-1;}.btn.pos-create-folder{flex:0 0 auto;width:auto;align-self:flex-start;min-height:44px;padding:10px 16px;}.pos-layout-actions{display:flex;gap:8px;flex-shrink:0;}
  .pos-back{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--info-soft);border:1px solid var(--info-border);color:var(--info);border-radius:var(--radius-m);padding:11px 15px;min-height:44px;font-size:14px;font-weight:700;white-space:nowrap;box-shadow:0 1px 2px rgba(49,85,143,.08);}
  .empty-hint{margin:auto;text-align:center;color:var(--muted);font-size:14.5px;max-width:260px;}

  /* ---- Analytics ---- */
  .analytics-period-modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:640px){.analytics-period-modal-grid{grid-template-columns:1fr;}}

  .analytics-filters{width:100%;min-width:0;}
  .analytics-period-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:14px;}
  .analytics-period-title{font-size:15px;font-weight:800;color:var(--ink);line-height:1.2;}
  .analytics-period-sub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35;}
  .analytics-period-layout{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;width:100%;min-width:0;}
  .analytics-date-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:end;min-width:0;flex:0 1 430px;box-sizing:border-box;width:100%;}
  .analytics-date-fields > .analytics-filter{min-width:0;width:100%;max-width:100%;box-sizing:border-box;overflow:hidden;}
  .analytics-date-fields > .analytics-filter input,.analytics-date-fields > .analytics-filter select{width:100%;max-width:100%;min-width:0;box-sizing:border-box;}
  .analytics-filter{min-width:0;display:flex;flex-direction:column;}
  .analytics-filter label{display:block;height:auto;font-size:11.5px;color:var(--muted);font-weight:800;margin:0 0 6px 2px;}
  .analytics-filter input,.analytics-filter select{box-sizing:border-box;width:100%;max-width:100%;height:var(--control-height);background:var(--surface);border:1.5px solid var(--border);border-radius:var(--control-radius-large);padding:0 12px;color:var(--ink);font:inherit;font-weight:700;min-width:0;display:block;outline:none;transition:border-color .12s,box-shadow .12s,background .12s;}
  .analytics-filter input[type='date']{display:block;width:100%;min-width:0;max-width:100%;box-sizing:border-box;flex:1 1 auto;overflow:hidden;min-inline-size:0;-webkit-appearance:none;line-height:43px;}
  .analytics-filter input[type='date']::-webkit-date-and-time-value{min-width:0;text-align:left;height:43px;line-height:43px;padding:0;margin:0;}
  .analytics-filter input[type='date']::-webkit-calendar-picker-indicator{margin:auto 0 auto auto;padding:2px;max-width:18px;}
  .analytics-filter input:focus,.analytics-filter select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 13%,transparent);}
  .analytics-presets-wrap{display:flex;flex-direction:column;gap:6px;flex:0 0 auto;}
  .analytics-presets-label{font-size:11.5px;color:var(--muted);font-weight:800;margin-left:2px;}
  .analytics-presets{display:flex;align-items:center;gap:6px;padding:4px;background:var(--bg);border:1px solid var(--border);border-radius:14px;}
  .analytics-presets .btn{box-sizing:border-box;width:auto!important;min-width:88px;height:44px;padding:0 13px;white-space:nowrap;border-radius:var(--radius-s)!important;border:1px solid transparent;font-size:12.5px;font-weight:800;background:transparent;color:var(--muted);box-shadow:none;transition:background .12s,color .12s,border-color .12s,transform .12s;}
  .analytics-presets .btn:hover{background:var(--surface);color:var(--ink);border-color:var(--border);}
  .analytics-presets .btn.analytics-preset-active{background:var(--surface);color:var(--accent);border-color:var(--border);box-shadow:0 1px 3px rgba(0,0,0,.07);}
  .analytics-presets .btn:active{transform:scale(.97);}
  :root[data-theme='dark'] .analytics-presets .btn.analytics-preset-active{background:var(--surface);color:var(--accent);border-color:var(--border);box-shadow:0 1px 3px rgba(0,0,0,.22);}

  @media(max-width:900px){
    .analytics-kpis{grid-template-columns:repeat(2,minmax(0,1fr));}
    .analytics-grid-2{grid-template-columns:1fr;}
    .analytics-period-layout{align-items:stretch;flex-direction:column;gap:12px;}
    .analytics-date-fields{flex:1 1 auto;width:100%;grid-template-columns:repeat(2,minmax(0,1fr));}
    .analytics-presets-wrap{width:100%;}
    .analytics-presets{width:100%;}
    .analytics-presets .btn{flex:1 1 0;min-width:0;}
  }
  @media(max-width:620px){
    .analytics-kpis{grid-template-columns:1fr 1fr;}
    .hbar-row{grid-template-columns:100px 1fr 68px;}
    .analytics-period-head{margin-bottom:12px;}
    .analytics-date-fields{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;}
    .analytics-filter input{height:44px;padding:0 10px;}
    .analytics-presets{gap:4px;padding:3px;border-radius:12px;}
    .analytics-presets .btn{height:44px;padding:0 5px;font-size:12px;border-radius:var(--radius-s)!important;}
  }
  @media(max-width:420px){
    .analytics-date-fields{grid-template-columns:1fr;}
    .analytics-presets .btn{font-size:11.5px;}
  }
  .analytics-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
  .analytics-kpi{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow);}
  .analytics-kpi .k-label{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
  .analytics-kpi .k-value{font-size:24px;font-weight:800;margin-top:7px;}
  .analytics-sensitive{filter:blur(8px);user-select:none;cursor:pointer;}
  .analytics-sensitive-wrap{position:relative;min-height:31px;}
  .analytics-lock-btn{margin-top:7px;width:auto!important;height:44px;padding:0 11px!important;font-size:12px!important;}
  .analytics-grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
  .analytics-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:var(--shadow);min-width:0;}
  .analytics-section-gap{margin-bottom:14px;}
  .analytics-loyalty-kpis{margin-top:12px;}
  .analytics-title{font-size:16px;font-weight:800;margin-bottom:4px;}

<script>
/* ============================= STATE ============================= */
let state = {
  products: [],
  shifts: [],
  employees: [],

  parked: [],

  operationalRevision: 0,

  loyaltyLoadingCustomerId: '',
  loyaltyLoadError: '',

  deliveryFee: 0,

  _splitPayments: [],
  _splitCount: 0,
  _splitPaymentTotalCents: null,

  analyticsTo: '',

  loyaltyAnalyticsKey: '',
  hallTables: [],
  bookings: [],

  webEventsSource: null,
  inventoryConfig: {enabled:false,frequency:'monthly',productIds:[],lastCompletedAt:null},
  inventoryHistory: [],
  inventoryDraft: null,
  bookingDate: '',
  bookingTime: '19:00',
  bookingDuration: 120,
  selectedHallTableId: null,
  hallEditMode: false,
  telegram: {enabled:false, botToken:'', chatId:'', threadId:'', deviceChatId:'', ownerChatId:'', notifyOnlineOrders:false, notifyShiftOpened:true, notifyShiftClosed:true, notifyMonthlyWarehouse:false, lastMonthlyWarehouseSent:''},
  network: {backendUrl:'https://project-dubrovno.up.railway.app', deviceKey:'', deviceName:'M POS iPad', lastSyncAt:null, lastSyncStatus:''}
};

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const money = (n) => (Math.round((n||0)*100)/100).toFixed(2).replace('.', ',') + ' ' + state.currency;
const fullMoney = (n) => (Math.round((n||0)*100)/100).toFixed(2).replace('.', ',') + ' ' + state.currency;
const fmtDate = (ts) => new Date(ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});

/* ============================= STORAGE ============================= */
// Внутри Claude используется window.storage (облачное хранилище артефакта).
// При запуске как самостоятельного сайта (после хостинга/Safari) такого API нет —
// тогда данные хранятся в localStorage самого браузера на устройстве.
const hasCloudStorage = (typeof window.storage !== 'undefined');
const LS_PREFIX = 'prilavok_';
let storageBroken = false;
let storageCheckedOnce = false;
const CRITICAL_STORAGE_JOURNAL_KEY = 'criticalStorageJournal';
const CRITICAL_STORAGE_KEYS = new Set(['products','orders','shifts','employees','parked','purchaseOrders','receivings','receivingDraft','suppliers','discounts','layout','posNavigation','company','deliveryRates','hallTables','bookings','inventoryConfig','inventoryHistory','inventoryDraft','currentOrderSession','printer','theme','telegram','network','demandOverload','operationalOutbox','operationalRevision','webEvents','webOrderAcceptances']);
let criticalStorageRecoveryPending = false;
let criticalOperationBusy = false;

function markStorageBroken(reason){
  storageBroken = true;
  console.error('Хранилище недоступно:', reason);
}

// Проверяем прямо при загрузке, реально ли доступен localStorage
// (в некоторых хостингах/встроенных предпросмотрах он заблокирован —
// тогда любая запись тихо проваливается, и данные "исчезают" после обновления).
function testLocalStorage(){
  try{
    const testKey = LS_PREFIX + '__test__';
    localStorage.setItem(testKey, '1');
    const ok = localStorage.getItem(testKey) === '1';
    localStorage.removeItem(testKey);
    return ok;
  }catch(e){ return false; }
}

// Compatibility facade: keep callers, fallbacks and the storage warning unchanged.
async function loadKey(key, fallback){
  try{
    return await window.PrilavokCore.Storage.get(key, fallback, markStorageBroken);
  }catch(e){ markStorageBroken(e); return fallback; }
}
async function saveKey(key, value){
  try{
    await window.PrilavokCore.Storage.set(key, value);
  }
  catch(e){ markStorageBroken(e); }
}
function storageRecordArray(value,key){
  if(!Array.isArray(value)){markStorageBroken('Некорректный формат '+key);return []}
  const records=value.filter(item=>item&&typeof item==='object'&&!Array.isArray(item));
  if(records.length!==value.length)markStorageBroken('Некорректные записи '+key);
  return records;
}
function storageRecord(value,key,fallback={}){
  if(value&&typeof value==='object'&&!Array.isArray(value))return value;
  if(value!==null&&value!==undefined)markStorageBroken('Некорректный формат '+key);
  return storageSnapshot(fallback);
}
function storageSnapshot(value){
  return JSON.parse(JSON.stringify(value));
}
function criticalStorageWrites(writes){
  if(!writes || typeof writes!=='object' || Array.isArray(writes)) throw new Error('Некорректная локальная транзакция');
  const entries=Object.entries(writes);
  if(!entries.length || entries.some(([key])=>!CRITICAL_STORAGE_KEYS.has(key))) throw new Error('Некорректные ключи локальной транзакции');
  return entries.map(([key,value])=>({key,value:storageSnapshot(value)}));
}
async function recoverCriticalStorageJournal(){
  let journal;
  try{journal=await window.PrilavokCore.Storage.get(CRITICAL_STORAGE_JOURNAL_KEY,null,markStorageBroken)}
  catch(e){markStorageBroken(e);criticalStorageRecoveryPending=true;return false}
  if(!journal)return true;
  criticalStorageRecoveryPending=true;
  try{
    if(journal.version!==1 || !Array.isArray(journal.writes) || !journal.writes.length)throw new Error('Повреждён журнал критической операции');
    for(const entry of journal.writes){
      if(!entry || !CRITICAL_STORAGE_KEYS.has(entry.key))throw new Error('Недопустимый ключ в журнале критической операции');
      await window.PrilavokCore.Storage.set(entry.key,entry.value);
    }
    await window.PrilavokCore.Storage.set(CRITICAL_STORAGE_JOURNAL_KEY,null);
    criticalStorageRecoveryPending=false;
    return true;
  }catch(e){markStorageBroken(e);return false}
}
async function commitCriticalStorage(type,writes){
  if(criticalStorageRecoveryPending)throw new Error('Незавершённая операция хранения. Перезапустите M POS для восстановления данных');
  const journal={version:1,id:uid(),type:String(type||'critical'),createdAt:Date.now(),writes:criticalStorageWrites(writes)};
  try{await window.PrilavokCore.Storage.set(CRITICAL_STORAGE_JOURNAL_KEY,journal)}
  catch(e){markStorageBroken(e);throw new Error('Не удалось начать безопасное сохранение: '+(e?.message||e))}
  criticalStorageRecoveryPending=true;
  try{
    for(const entry of journal.writes)await window.PrilavokCore.Storage.set(entry.key,entry.value);
    await window.PrilavokCore.Storage.set(CRITICAL_STORAGE_JOURNAL_KEY,null);
    criticalStorageRecoveryPending=false;
  }catch(e){markStorageBroken(e);throw new Error('Операция сохранена для восстановления. Перезапустите M POS: '+(e?.message||e))}
}
async function loadAll(){
  if(!hasCloudStorage && !testLocalStorage()){
    markStorageBroken('localStorage test write failed');
  }
  storageCheckedOnce = true;
  await recoverCriticalStorageJournal();
  const [products, shifts, employees, orders, parked, demandOverload, operationalOutbox, operationalRevision, receivings, suppliers, purchaseOrders, discounts, layout, printer, theme, company, deliveryRates, telegram, network, currentOrderSession, hallTables, bookings, webEvents, posNavigation, inventoryConfig, inventoryHistory, inventoryDraft] = await Promise.all([
    loadKey('products', null),
    loadKey('shifts', []),
    loadKey('employees', []),
    loadKey('orders', []),
    loadKey('parked', []),
    loadKey('demandOverload', false),
    loadKey('operationalOutbox', []),
    loadKey('operationalRevision', 0),
    loadKey('receivings', []),
    loadKey('suppliers', []),
    loadKey('purchaseOrders', []),
    loadKey('discounts', []),
    loadKey('layout', {categoryOrder:[], categoryColors:{}, categorySymbols:{}, categoryOnline:{}, categoryOnlineOrder:{}, categoryOnlineMenu:{}}),
    loadKey('printer', {enabled:false, autoPrint:false, ip:'', port:9100 }),
    loadKey('theme', 'light'),
    loadKey('company', {establishmentName:'', legalName:'', address:'', deliveryAddress:''}),
    loadKey('deliveryRates', []),
    loadKey('telegram', {enabled:false, botToken:'', chatId:'', threadId:'', deviceChatId:'', ownerChatId:'', notifyOnlineOrders:false, notifyShiftOpened:true, notifyShiftClosed:true, notifyMonthlyWarehouse:false, lastMonthlyWarehouseSent:''}),
    loadKey('network', {backendUrl:'https://project-dubrovno.up.railway.app', deviceKey:'', deviceName:'M POS iPad', lastSyncAt:null, lastSyncStatus:''}),
    loadKey('currentOrderSession', null),
    loadKey('hallTables', []),
    loadKey('bookings', []),
    loadKey('webEvents', []),
    loadKey('posNavigation', {version:1,categories:[]}),
    loadKey('inventoryConfig', {enabled:false,frequency:'monthly',productIds:[],lastCompletedAt:null}),
    loadKey('inventoryHistory', []),
    loadKey('inventoryDraft', null)
  ]);
  const productRowsValid=products===null||(Array.isArray(products)&&products.every(item=>item&&typeof item==='object'&&!Array.isArray(item)));
  if(!productRowsValid)markStorageBroken('Некорректный формат products');
  state.products = products===null ? seedProducts() : (Array.isArray(products)?products.filter(item=>item&&typeof item==='object'&&!Array.isArray(item)):[]);
  state.shifts = storageRecordArray(shifts,'shifts');
  state.employees = storageRecordArray(employees,'employees');
  state.employees.forEach(e=>{ e.role = e.role==='admin' ? 'admin' : 'employee'; });
  state.orders = storageRecordArray(orders,'orders');
  state.parked = storageRecordArray(parked,'parked');
  state.demandOverload = demandOverload === true;
  state.operationalOutbox = Array.isArray(operationalOutbox) ? operationalOutbox.slice(-2) : [];
  state.operationalRevision = Math.max(0,Number(operationalRevision)||0);
  state.receivings = storageRecordArray(receivings,'receivings');
  state.suppliers = storageRecordArray(suppliers,'suppliers');
  state.purchaseOrders = storageRecordArray(purchaseOrders,'purchaseOrders');
  state.purchaseOrderSupplierId = '';
  state.purchaseOrderCart = [];
  state.discounts = storageRecordArray(discounts,'discounts');
  state.receivingCart = [];
  const layoutShapeValid=!!layout&&typeof layout==='object'&&!Array.isArray(layout);
  const safeLayout=storageRecord(layout,'layout',{categoryOrder:[],categoryColors:{},categorySymbols:{},categoryOnline:{},categoryOnlineOrder:{},categoryOnlineMenu:{}});
  state.categoryOrder = Array.isArray(safeLayout.categoryOrder)?safeLayout.categoryOrder:[];
  state.categoryColors = storageRecord(safeLayout.categoryColors,'layout.categoryColors',{});
  state.categorySymbols = storageRecord(safeLayout.categorySymbols,'layout.categorySymbols',{});
  const legacyCategoryOnline=storageRecord(safeLayout.categoryOnline,'layout.categoryOnline',{});
  state.categoryOnlineOrder = storageRecord(safeLayout.categoryOnlineOrder,'layout.categoryOnlineOrder',Object.assign({},legacyCategoryOnline));
  state.categoryOnlineMenu = storageRecord(safeLayout.categoryOnlineMenu,'layout.categoryOnlineMenu',Object.assign({},legacyCategoryOnline));
  state.categoryOrder.forEach(c=>{
    const legacy=typeof legacyCategoryOnline[c]==='boolean'?legacyCategoryOnline[c]:true;
    if(typeof state.categoryOnlineOrder[c] !== 'boolean') state.categoryOnlineOrder[c]=legacy;
    if(typeof state.categoryOnlineMenu[c] !== 'boolean') state.categoryOnlineMenu[c]=legacy;
  });

function getProduct(id){ return state.products.find(p=>p.id===id); }
// Expand a recipe into simple products; shared ingredients are summed across branches.
// Quantities stay in the existing stock units. No conversion or data migration here.
function productIngredients(p, qty=1, trail=new Set(), totals=new Map(), resolve=getProduct){
  if(!p) throw new Error('Товар или ингредиент не найден');
  qty=Number(qty);
  if(!Number.isFinite(qty) || qty<=0) throw new Error('Количество ингредиента должно быть больше нуля');
  if(trail.has(p.id)) throw new Error('Циклический состав: '+p.name);
  if(p.type==='simple'){
    const total=(totals.get(p.id)||0)+qty;
    if(!Number.isFinite(total)) throw new Error('Слишком большое количество: '+p.name);
    totals.set(p.id,total);
    return totals;
  }
  if(p.type!=='composite' || !Array.isArray(p.components) || !p.components.length){
    throw new Error('Проверьте состав товара: '+p.name);
  }
  trail.add(p.id);
  for(const c of p.components){
    if(!c) throw new Error('Некорректный ингредиент: '+p.name);
    productIngredients(resolve(c.productId),qty*Number(c.qty),trail,totals,resolve);
  }
  trail.delete(p.id);
  return totals;
}
function stockConsumptionFor(items){
  const totals=new Map();
  for(const item of items){
    productIngredients(getProduct(item.productId),item.qty,new Set(),totals);
    for(const m of (item.selectedModifiers||[])){
      const mp=getProduct(m.productId);
      if(!mp) throw new Error('Товар-модификатор не найден');
      productIngredients(mp,Number(item.qty||0)*Number(m.qty||0),new Set(),totals);
    }
  }
  return {version:1,items:[...totals].filter(([id])=>productTracksStock(getProduct(id))).map(([productId,qty])=>({productId,qty}))};
}
function checkedStockConsumption(items){
  const consumption=stockConsumptionFor(items);
  for(const item of consumption.items){
    const p=getProduct(item.productId);
    const stock=Number(p.stock)||0;
    const tolerance=Number.EPSILON*8*Math.max(Math.abs(stock),item.qty);
    if(!Number.isFinite(stock) || stock+tolerance<item.qty) throw new Error('Недостаточно остатка: '+p.name);
  }
  return consumption;
}
function canFulfillCart(items=state.cart){
  try{ checkedStockConsumption(items); return true; }
  catch(e){ flash(e.message); return false; }
}
function hasUnreturnedStockConsumption(productId){
  return state.orders.some(o=>!o.returnedAt && o.stockConsumption?.items?.some(i=>i.productId===productId));
}
function availableStock(p, resolve=getProduct){
  if(!p) return 0;
  if(p.type==='simple') return p.noStockTracking ? Infinity : (Number(p.stock)||0);
  try{
    const ingredients=productIngredients(p,1,new Set(),new Map(),resolve);
    let min=Infinity;
    for(const [id,qty] of ingredients){
      const ingredient=resolve(id);
      if(!productTracksStock(ingredient)) continue;
      const ratio=(Number(ingredient.stock)||0)/qty;
      if(!Number.isFinite(ratio)) return 0;
      const tolerance=Number.EPSILON*8*Math.max(1,Math.abs(ratio));
      min=Math.min(min,Math.max(0,Math.floor(ratio+tolerance)));
    }
    return min;
  }catch(e){ return 0; }
}
let compositeCostCache=new Map();
function clearCompositeCostCache(){compositeCostCache.clear();}
function compositeCost(p){
  if(!p) return 0;
  if(p.type==='simple') return p.cost || 0;
  if(compositeCostCache.has(p.id))return compositeCostCache.get(p.id);
  try{const value=[...productIngredients(p)].reduce((sum,[id,qty])=>sum+(Number(getProduct(id).cost)||0)*qty,0);compositeCostCache.set(p.id,value);return value;}
  catch(e){return 0;}
}
function compositeCostForQuantity(p,qty,unit){
  if(!p)return 0;
  if(p.type==='simple')return compositeCost(p)*componentBaseQty(p,qty,unit);
  return compositeCost(p)*componentBaseQty(p,qty,unit);
}

const OPERATIONAL_SCHEMA_VERSION=1,OPERATIONAL_TIMEOUT=2500,OPERATIONAL_MAX_BACKOFF=60000;

function operationalCoalesce(type,payload,now=Date.now()){
  const item={id:uid(),type,schemaVersion:OPERATIONAL_SCHEMA_VERSION,createdAt:now,attempts:0,nextAttemptAt:now,payload};
  state.operationalOutbox=(state.operationalOutbox||[]).filter(x=>x.type!==type);

function operationalBackoffMs(attempts){return Math.min(OPERATIONAL_MAX_BACKOFF,Math.max(1000,1000*Math.pow(2,Math.min(6,Math.max(0,Number(attempts)||0)))));}
async function sendOperationalItem(item){
  const n=networkConfigFromState();if(!n.backendUrl||!n.deviceKey)return false;
  operationalController=new AbortController();const timeout=setTimeout(()=>operationalController?.abort(),OPERATIONAL_TIMEOUT);
  try{
    const endpoint='/api/operational/snapshot';
    const r=await fetch(n.backendUrl.replace(/\/+$/,'')+endpoint,{method:'POST',headers:{'Content-Type':'application/json','X-Device-Key':n.deviceKey},body:JSON.stringify(item.payload),cache:'no-store',signal:operationalController.signal});
    if(!r.ok)throw new Error('HTTP '+r.status);return true;

}
async function flushOperationalOutbox(){
  if(operationalBusy||document.hidden||window._availabilityAppActive===false||!state.loaded||storageBroken)return false;
  operationalBusy=true;
  try{
    let sentAny=false;
    while(!document.hidden&&window._availabilityAppActive!==false){
      const now=Date.now(),item=(state.operationalOutbox||[]).filter(x=>(Number(x.nextAttemptAt)||0)<=now).sort((a,b)=>a.createdAt-b.createdAt)[0];
      if(!item)return sentAny||true;

        if(await sendOperationalItem(item)){
          state.operationalOutbox=state.operationalOutbox.filter(x=>x.id!==item.id);operationalFailures=0;sentAny=true;
          state.network.lastOperationalSyncAt=Date.now();state.network.lastOperationalStatus='ok';saveKey('network',state.network);saveKey('operationalOutbox',state.operationalOutbox);continue;
        }
      }catch(e){
        item.attempts=(Number(item.attempts)||0)+1;operationalFailures=item.attempts;item.nextAttemptAt=Date.now()+operationalBackoffMs(item.attempts);state.network.lastOperationalStatus='offline';saveKey('network',state.network);saveKey('operationalOutbox',state.operationalOutbox);
      }
      return false;
    }
    return sentAny;
  }finally{operationalBusy=false;}
}
function operationalReconnect(){
  if(!state.loaded||document.hidden||window._availabilityAppActive===false)return;
  operationalFailures=0;void recoverWebAcceptanceJournal();void retryPendingLoyalty();

}
function startOperationalSchedule(){
  clearTimeout(operationalTimer);operationalTimer=null;

}
function operationalStateChanged(){

function runOperationalChannelTests(){
  const originalOutbox=state.operationalOutbox,originalRevision=state.operationalRevision,checks=[];state.operationalOutbox=[];
  operationalCoalesce('snapshot',{n:1},1000);operationalCoalesce('snapshot',{n:2},1001);
  checks.push({name:'outbox keeps only latest snapshot',ok:state.operationalOutbox.length===1&&state.operationalOutbox[0]?.type==='snapshot',details:JSON.stringify(state.operationalOutbox.map(x=>x.type))});
  checks.push({name:'latest snapshot wins',ok:state.operationalOutbox.find(x=>x.type==='snapshot')?.payload?.n===2});
  const revisionBefore=state.operationalRevision;queueOperationalSnapshot(1004);const rev1=state.operationalOutbox.find(x=>x.type==='snapshot')?.payload?.revision;queueOperationalSnapshot(1005);const rev2=state.operationalOutbox.find(x=>x.type==='snapshot')?.payload?.revision;checks.push({name:'snapshot revision is monotonic',ok:Number(rev2)===Number(rev1)+1&&Number(rev1)>revisionBefore});
  checks.push({name:'backoff is bounded',ok:operationalBackoffMs(100)<=OPERATIONAL_MAX_BACKOFF});
  state.operationalOutbox=originalOutbox;state.operationalRevision=originalRevision;saveKey('operationalOutbox',state.operationalOutbox);saveKey('operationalRevision',state.operationalRevision);
  return checks;
}

function buildMenuSyncPayload(){
  const categoryNames=[];
  const addCat=(name)=>{ const n=String(name||'').trim(); if(n && !categoryNames.includes(n)) categoryNames.push(n); };
  (state.categoryOrder||[]).forEach(addCat);
  (state.products||[]).forEach(p=>addCat(p.category||'Без категории'));
  const categories=categoryNames.map((name,index)=>({
    externalId:'category:'+name,
    name,
    color:(state.categoryColors||{})[name]||'',
    sortOrder:index,
    isActive:true,
    availableOnline:(state.categoryOnlineOrder||{})[name]!==false,
    visibleInOnlineMenu:(state.categoryOnlineMenu||{})[name]!==false
  }));
  const products=(state.products||[]).map((p,index)=>({
    externalId:String(p.id),
    name:String(p.name||''),
    description:String(p.description||''),
    price:Number(p.price||0),
    category:String(p.category||'Без категории'),
    sortOrder:Number.isFinite(Number(p.sortOrder)) ? Number(p.sortOrder) : index,
    isActive:true,
    availableOnline:(p.availableOnline!==false) && (state.categoryOnlineOrder[String(p.category||'Без категории').trim() || 'Без категории']!==false),
    visibleInOnlineMenu:(p.availableInOnlineMenu!==false) && (state.categoryOnlineMenu[String(p.category||'Без категории').trim() || 'Без категории']!==false),
    imageUrl:String(p.imageUrl||'')
  })).filter(p=>p.name);
  return {deviceKey:networkConfigFromState().deviceKey,deviceName:networkConfigFromState().deviceName,categories,products};
}

async function saveTelegramSettings(closeAfter=false){
  if(!currentShiftEmployeeIsAdmin()){ flash('Сетевые конфигурации доступны только администратору'); return; }
  const next={
    enabled:!!document.getElementById('telegram-enabled')?.checked,
    botToken:(document.getElementById('telegram-token')?.value||'').trim(),
    chatId:(document.getElementById('telegram-chat-id')?.value||'').trim(),
    threadId:(document.getElementById('telegram-thread-id')?.value||'').trim(),
    deviceChatId:(document.getElementById('telegram-device-chat-id')?.value||'').trim(),
    ownerChatId:(document.getElementById('telegram-owner-chat-id')?.value||'').trim(),
    notifyOnlineOrders:!!document.getElementById('telegram-online-orders')?.checked,
    notifyShiftOpened:!!document.getElementById('telegram-shift-opened')?.checked,
    notifyShiftClosed:!!document.getElementById('telegram-shift-closed')?.checked,
    notifyMonthlyWarehouse:!!document.getElementById('telegram-monthly-warehouse')?.checked,
    lastMonthlyWarehouseSent:state.telegram?.lastMonthlyWarehouseSent||''
  };
  if(next.enabled&&next.notifyOnlineOrders&&!/^\d{1,20}$/.test(next.deviceChatId)){flash('Укажите корректный ID рабочего устройства');return false}
  if(next.ownerChatId&&!/^\d{1,20}$/.test(next.ownerChatId)){flash('Укажите корректный ID владельца');return false}
  try{await window.PrilavokCore.Storage.set('telegram',next)}catch(e){markStorageBroken(e);flash('Не удалось сохранить настройки Telegram');return false}
  state.telegram=next;if(closeAfter)closeModal();render();
  const synced=await syncTelegramBackendSettings(next);
  flash(synced?'Настройки Telegram сохранены':'Настройки сохранены на iPad, но серверные настройки Telegram не обновлены');
  return synced;
}
function telegramConfigFromState(){
  const t=state.telegram||{};
  return {enabled:!!t.enabled,botToken:String(t.botToken||''),chatId:String(t.chatId||''),threadId:String(t.threadId||''),deviceChatId:String(t.deviceChatId||''),ownerChatId:String(t.ownerChatId||''),notifyOnlineOrders:t.notifyOnlineOrders===true,notifyShiftOpened:t.notifyShiftOpened!==false,notifyShiftClosed:t.notifyShiftClosed!==false,notifyMonthlyWarehouse:t.notifyMonthlyWarehouse===true,lastMonthlyWarehouseSent:String(t.lastMonthlyWarehouseSent||'')};
}
function telegramNativeRequest(action, extra={}){
  const cfg=telegramConfigFromState();
  if(!cfg.enabled || !cfg.botToken || !cfg.chatId) return false;
  if(window.webkit?.messageHandlers?.telegram){
    window.webkit.messageHandlers.telegram.postMessage({...cfg,action,...extra});
    return true;
  }
  return false;
}
async function syncTelegramBackendSettings(config){
  const network=networkConfigFromState();
  if(!network.backendUrl||!network.deviceKey)return false;
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),5000);
  try{
    const response=await fetch(network.backendUrl.replace(/\/+$/,'')+'/api/device/telegram-settings',{method:'PUT',headers:{'Content-Type':'application/json','X-Device-Key':network.deviceKey},body:JSON.stringify({chatId:config.deviceChatId||'',ownerChatId:config.ownerChatId||'',enabled:config.enabled===true&&config.notifyOnlineOrders===true}),cache:'no-store',signal:controller.signal});
    return response.ok;
  }catch(e){return false}finally{clearTimeout(timeout)}
}

function previousCalendarMonthRange(now=new Date()){
  const firstCurrent=new Date(now.getFullYear(),now.getMonth(),1);
  const lastPrevious=new Date(firstCurrent); lastPrevious.setDate(0);
  const firstPrevious=new Date(lastPrevious.getFullYear(),lastPrevious.getMonth(),1);
  const key=firstPrevious.getFullYear()+'-'+String(firstPrevious.getMonth()+1).padStart(2,'0');
  return {key,from:localDateString(firstPrevious),to:localDateString(lastPrevious)};
}
function maybeSendMonthlyWarehouseReport(){
  const t=telegramConfigFromState();
  if(!t.enabled || !t.notifyMonthlyWarehouse || !t.botToken || !t.chatId) return;
  if(!currentShiftEmployeeIsAdmin()) return;
  if(!window.webkit?.messageHandlers?.telegram) return;
  try{
    const period=previousCalendarMonthRange();
    if(t.lastMonthlyWarehouseSent===period.key) return;
    const payload=warehouseExportPayload(warehouseReport(period.from,period.to));
    window.webkit.messageHandlers.telegram.postMessage({...t,action:'sendMonthlyWarehouseReport',periodKey:period.key,report:payload});
  }catch(e){ console.error('Не удалось подготовить ежемесячный складской отчёт:',e); }
}
window.onTelegramMonthlyWarehouseResult=function(result){
  if(result?.ok && result.periodKey){
    state.telegram.lastMonthlyWarehouseSent=String(result.periodKey);
    saveKey('telegram',state.telegram);
    flash(result.message||'Ежемесячный складской отчёт отправлен в Telegram');
  }else if(result?.message){
    flash(result.message);
  }
};

function requestDelete(type, id){
  if(!['product','category'].includes(type))return;
  const passwordRequired=type!=='product'||!currentShiftEmployeeIsAdmin();
  const title = type==='category' ? 'Удаление категории' : 'Удаление товара';
  const label = type==='category' ? id : (getProduct(id)?.name || 'товар');
  showModal(`
    <div class="modal-title">${title}</div>
    <div class="center-note delete-confirm-note">${passwordRequired?'Для удаления «'+escapeHtml(label)+'» введите пароль.':'Удалить товар «'+escapeHtml(label)+'»?'}</div>
    ${passwordRequired?'<div class="field"><label>Пароль</label><input type="password" id="delete-password" autocomplete="off" placeholder="Введите пароль"></div>':''}
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
      <button class="btn btn-danger" onclick="confirmDelete('${type}','${escapeAttr(id)}')">Удалить</button>
    </div>`);
  if(passwordRequired)setTimeout(()=>document.getElementById('delete-password')?.focus(),50);
}
function confirmDelete(type,id){
  if(!['product','category'].includes(type))return;
  const pass=document.getElementById('delete-password')?.value||'';
  if(!(type==='product'&&currentShiftEmployeeIsAdmin()) && pass!=='Rom23061998'){ flash('Неверный пароль'); return; }
  if(type==='category'){
    if(state.products.some(p=>productCategoryKey(p)===id)){ flash('Нельзя удалить категорию: в ней есть товары'); return; }
    state.posNavigation.categories=state.posNavigation.categories.filter(e=>e.category!==id);saveKey('posNavigation',state.posNavigation);
    state.categoryOrder=state.categoryOrder.filter(c=>c!==id);
    delete state.categoryColors[id];
    delete state.categorySymbols[id];
    delete state.categoryOnline[id];
    delete state.categoryOnlineOrder[id];
    delete state.categoryOnlineMenu[id];
    state.layoutTiles=state.layoutTiles.filter(t=>!(t.type==='category' && t.id===id));
    saveKey('layout',categoryLayoutSnapshot());
    closeModal(); render(); flash('Категория удалена');
  } else {
    if(hasUnreturnedStockConsumption(id)){ flash('Товар нужен для возврата ранее проданных чеков'); return; }
    const usedIn=state.products.filter(p=>p.type==='composite' && (p.components||[]).some(c=>c.productId===id));
    if(usedIn.length){ flash('Товар используется в составном товаре «'+usedIn[0].name+'»'); return; }
    state.products=state.products.filter(p=>p.id!==id);
    saveKey('products',state.products);
    state.layoutTiles=state.layoutTiles.filter(t=>!(t.type==='product' && t.id===id));
    saveKey('layout',categoryLayoutSnapshot());
    closeModal(); render(); flash('Товар удалён');
    if(window._pmEditingId===id && document.getElementById('pe-save'))finishProductEditor();
  }
}
