name: M-POS Android toolchain
description: Pinned Java/Android/Gradle tools; optional disposable API36 emulator image.
inputs:
  emulator:
    description: Install the API36 image and enable KVM
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
    - name: Android SDK 36
      shell: bash
      run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
    - name: API36 image and KVM
      if: inputs.emulator == 'true'
      shell: bash
      run: |
        sdkmanager "emulator" "system-images;android-36;default;x86_64"
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
