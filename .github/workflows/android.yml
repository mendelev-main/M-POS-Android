name: Android checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Prepare Android SDK
        run: bash scripts/ci/setup-sdk.sh
      - name: Verify bundled POS source
        run: node --test tests/*.test.cjs
      - name: Verify CI version rules
        run: python3 -m unittest discover -s tests -p 'test_ci_*.py'
      - name: Run Kotlin tests and lint
        run: |
          set -o pipefail
          ./gradlew --no-daemon --max-workers=4 testDebugUnitTest lintDebug 2>&1 | tee "$RUNNER_TEMP/mpos-kotlin-checks.log"
      - name: Annotate Kotlin verification failures
        if: failure()
        run: python3 scripts/ci/annotate-kotlin-checks.py
      - name: Publish verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M-POS-Android-test-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  build:
    name: Build APK
    needs: tests
    runs-on: ubuntu-latest
    env:
      MPOS_KEYSTORE_PASSWORD: ${{ secrets.MPOS_KEYSTORE_PASSWORD }}
      MPOS_KEY_ALIAS: ${{ secrets.MPOS_KEY_ALIAS }}
      MPOS_KEY_PASSWORD: ${{ secrets.MPOS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Prepare Android SDK
        run: bash scripts/ci/setup-sdk.sh
      - name: Assign increasing APK version
        run: python3 scripts/ci/version.py
      - name: Prepare permanent signing key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          MPOS_KEYSTORE_BASE64: ${{ secrets.MPOS_KEYSTORE_BASE64 }}
        run: python3 scripts/ci/signing.py
      - name: Build signed release APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: ./gradlew --no-daemon --max-workers=4 assembleRelease
      - name: Verify release signature and version
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 scripts/ci/verify-apk.py
      - name: Compile PR APK
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: ./gradlew --no-daemon --max-workers=4 assembleDebug
      - name: Publish signed release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: M-POS-Android-release-${{ env.MPOS_VERSION_NAME }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.json
            app/build/outputs/apk/release/app-release.sha256
          if-no-files-found: error
      - name: Remove private key
        if: always()
        run: rm -f "$RUNNER_TEMP/mpos-release.keystore"
