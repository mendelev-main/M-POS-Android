name: Android
run-name: M-POS · main · run ${{ github.run_number }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish after all checks (push main always publishes)'
        type: boolean
        default: false
      verify_upgrade_from:
        description: 'Signed upgrade baseline tag; empty means latest stable, checked BEFORE release'
        type: string
        default: ''
      release_notes:
        description: 'Visible changes for tablet users'
        type: string
        default: 'M-POS: обновление приложения и исправления.'

permissions:
  contents: read

# Preserve every pushed commit, including documentation commits. Jobs inside one run stay parallel.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  tooling:
    name: '1 · Harness и правила выпуска'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Repository, visual ledger and release tooling
        run: |
          python3 scripts/harness.py preflight
          python3 scripts/visual-progress.py --check
          python3 -m unittest discover -s scripts/tests -v
          git diff --check

  checks:
    name: '2 · JVM, lint и debug APK'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/android-setup
      - name: JVM tests, lint and debug build
        run: python3 scripts/harness.py android
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-check-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  emulator:
    name: '3 · Android 16: Room и данные'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/android-setup
        with:
          emulator: 'true'
      - name: Boot API36 and wait for a focused window
        run: python3 scripts/ci/emulator.py start
      - name: '3.1 · Room и бизнес-логика: Android-тесты'
        run: bash scripts/ci/android-emulator-checks.sh suite
      - name: Stop disposable emulator and collect diagnostics
        if: always()
        run: python3 scripts/ci/emulator.py stop
      - name: Android evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-data-reports-api-36
          path: |
            app/build/reports/androidTests/
            app/build/reports/emulator-diagnostics/
          if-no-files-found: warn
          retention-days: 14

  signed-apk:
    name: '4 · Подпись и проверка APK'
    needs: [tooling, checks, emulator]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version_name: ${{ steps.version.outputs.MPOS_VERSION_NAME }}
      version_code: ${{ steps.version.outputs.MPOS_VERSION_CODE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/android-setup
      - name: Monotonic release version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 scripts/release.py version --run "$RUN_NUMBER" --attempt "$RUN_ATTEMPT"
      - name: Validate permanent key and build signed release
        env:
          MPOS_KEYSTORE_BASE64: ${{ secrets.MPOS_KEYSTORE_BASE64 }}
          MPOS_KEYSTORE_PASSWORD: ${{ secrets.MPOS_KEYSTORE_PASSWORD }}
          MPOS_KEY_ALIAS: ${{ secrets.MPOS_KEY_ALIAS }}
          MPOS_KEY_PASSWORD: ${{ secrets.MPOS_KEY_PASSWORD }}
        run: |
          python3 scripts/release.py signing-setup --directory "$RUNNER_TEMP/mpos-signing"
          export MPOS_KEYSTORE_PATH="$RUNNER_TEMP/mpos-signing/release.jks"
          ./gradlew --no-daemon assembleRelease
      - name: Verify package, version and pinned signing certificate
        run: python3 scripts/release.py verify-apk app/build/outputs/apk/release/app-release.apk --build-tools "$ANDROID_HOME/build-tools/35.0.0" --code "$MPOS_VERSION_CODE" --name "$MPOS_VERSION_NAME"
      - name: Prepare immutable candidate assets
        env:
          RELEASE_NOTES: "${{ inputs.release_notes || 'M-POS: обновление приложения и исправления.' }}"
        run: python3 scripts/prepare-release.py --apk app/build/outputs/apk/release/app-release.apk --output build/release-channel --code "$MPOS_VERSION_CODE" --name "$MPOS_VERSION_NAME"
      - name: Verified signed candidate (not yet published)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: M-POS-Native-${{ env.MPOS_VERSION_NAME }}
          path: build/release-channel/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary private key
        if: always()
        run: rm -rf "$RUNNER_TEMP/mpos-signing"

  signed-install:
    name: '5 · Установка и обновление подписанного APK'
    needs: signed-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ANDROID_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/android-setup
        with:
          emulator: 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: M-POS-Native-${{ needs.signed-apk.outputs.version_name }}
          path: build/release-channel
      - name: Boot disposable Android 16
        run: python3 scripts/ci/emulator.py start
      - name: Validate signed APK, replace previous stable and verify cold start
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_TAG: ${{ inputs.verify_upgrade_from }}
        run: python3 scripts/ci/signed-apk-check.py --assets build/release-channel
      - name: Stop emulator and collect diagnostics
        if: always()
        run: python3 scripts/ci/emulator.py stop
      - name: Signed APK installation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-apk-install-reports
          path: |
            app/build/reports/signed-install/
            app/build/reports/emulator-diagnostics/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: '6 · GitHub Release и обновление для планшетов'
    needs: [signed-apk, signed-install]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: M-POS-Native-${{ needs.signed-apk.outputs.version_name }}
          path: build/release-channel
      - name: Upload complete release, then move the stable pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py --assets build/release-channel
      - name: Release summary
        env:
          VERSION: ${{ needs.signed-apk.outputs.version_name }}
        run: |
          echo "### M-POS $VERSION опубликован" >> "$GITHUB_STEP_SUMMARY"
          echo "APK, checksum и update.json: https://github.com/mendelev-main/M-POS-Android/releases/tag/v$VERSION" >> "$GITHUB_STEP_SUMMARY"
