name: Android

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "harness/**"
      - ".agents/**"
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish verified APK to the stable tablet update channel'
        type: boolean
        default: false
      verify_upgrade_from:
        description: 'Optional previous release tag for a real stable-channel upgrade smoke test'
        type: string
        default: ''
      release_notes:
        description: 'Visible changes for tablet users'
        type: string
        default: 'M-POS: обновление приложения и улучшения.'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Harness and release tooling tests
        run: |
          python3 scripts/harness.py preflight
          python3 -m unittest discover -s scripts/tests -v
      - name: JVM tests, lint and debug APK
        run: python3 scripts/harness.py android
      - name: Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-check-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  emulator:
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native launch and recreation smoke
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          script: |
            set -e
            ./gradlew --no-daemon connectedDebugAndroidTest
            python3 scripts/ci/update-e2e.py
      - name: UI reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-ui-reports-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/reports/update-e2e/
          if-no-files-found: warn
          retention-days: 14

  signed-apk:
    outputs:
      version_name: ${{ steps.version.outputs.MPOS_VERSION_NAME }}
      version_code: ${{ steps.version.outputs.MPOS_VERSION_CODE }}
    needs: [checks, emulator]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MPOS_KEYSTORE_BASE64: ${{ secrets.MPOS_KEYSTORE_BASE64 }}
      MPOS_KEYSTORE_PASSWORD: ${{ secrets.MPOS_KEYSTORE_PASSWORD }}
      MPOS_KEY_ALIAS: ${{ secrets.MPOS_KEY_ALIAS }}
      MPOS_KEY_PASSWORD: ${{ secrets.MPOS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Version and permanent key preflight
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 scripts/release.py version --run "$RUN_NUMBER" --attempt "$RUN_ATTEMPT"
          python3 scripts/release.py signing-setup --directory "$RUNNER_TEMP/mpos-signing"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Signed release
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify APK identity, version and certificate
        run: |
          python3 scripts/release.py verify-apk app/build/outputs/apk/release/app-release.apk --build-tools "$ANDROID_HOME/build-tools/35.0.0" --code "$MPOS_VERSION_CODE" --name "$MPOS_VERSION_NAME"
      - name: Prepare verified stable-channel assets
        env:
          RELEASE_NOTES: "${{ inputs.release_notes || 'M-POS: обновление приложения и улучшения.' }}"
        run: python3 scripts/prepare-release.py --apk app/build/outputs/apk/release/app-release.apk --output build/release-channel --code "$MPOS_VERSION_CODE" --name "$MPOS_VERSION_NAME"
      - name: Verified APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: M-POS-Native-${{ env.MPOS_VERSION_NAME }}
          path: build/release-channel/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary private key
        if: always()
        run: rm -rf "$RUNNER_TEMP/mpos-signing"

  publish:
    needs: signed-apk
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: stable-release-channel
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: M-POS-Native-${{ needs.signed-apk.outputs.version_name }}
          path: build/release-channel
      - name: Publish complete immutable release, then update stable pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py --assets build/release-channel

  production-upgrade:
    needs: [signed-apk, publish]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.verify_upgrade_from != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: M-POS-Native-${{ needs.signed-apk.outputs.version_name }}
          path: build/release-channel
      - name: Download the earlier signed public release
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_TAG: ${{ inputs.verify_upgrade_from }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"v[0-9][0-9A-Za-z._-]{0,79}", os.environ["BASE_TAG"])'
          gh release download "$BASE_TAG" --repo mendelev-main/M-POS-Android --pattern mpos-native.apk --dir build/upgrade-base
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual release-to-release update via public HTTPS channel and system installer
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          script: python3 scripts/ci/update-e2e.py --base-apk build/upgrade-base/mpos-native.apk --manifest build/release-channel/update.json
      - name: Real release upgrade evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-release-upgrade-reports
          path: app/build/reports/update-e2e/
          if-no-files-found: warn
          retention-days: 14
