name: Verify published update channel

on:
  workflow_dispatch:
    inputs:
      base_release:
        description: 'Earlier public release tag to upgrade from (emulators only)'
        type: string
        required: true
        default: 'v0.1.8.1'

permissions:
  contents: read

concurrency:
  group: verify-update-channel
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Harness and tooling regressions
        run: |
          python3 scripts/harness.py preflight
          python3 -m unittest discover -s scripts/tests -v
      - name: Download existing immutable public releases (no signing secrets)
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_TAG: ${{ inputs.base_release }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"v[0-9][0-9A-Za-z._-]{0,79}", os.environ["BASE_TAG"])'
          gh release download "$BASE_TAG" --repo mendelev-main/M-POS-Android --pattern mpos-native.apk --dir build/upgrade-base
          gh release download --repo mendelev-main/M-POS-Android --pattern update.json --dir build/release-channel
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real release upgrade, permission UI, cancellation and preserved settings
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          script: python3 scripts/ci/update-e2e.py --base-apk build/upgrade-base/mpos-native.apk --manifest build/release-channel/update.json
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-upgrade-api-${{ matrix.api }}
          path: app/build/reports/update-e2e/
          if-no-files-found: warn
          retention-days: 14
